version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "8888:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../prosody/certs/localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ../prosody/certs/localhost.key:/etc/nginx/certs/localhost.key:ro
    restart: unless-stopped
