events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS resolver for Docker
    resolver 127.0.0.11 ipv6=off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=bosh_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream for Prosody BOSH
    upstream prosody_bosh {
        server host.docker.internal:15280;
    }

    # HTTP server - serves content + proxies XMPP, redirects other to HTTPS
    server {
        listen 80;
        server_name _;

        # Connection limit per IP
        limit_conn conn_limit 20;

        # Static files from Python server
        location / {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://host.docker.internal:9090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket endpoint to Prosody (also on HTTP for backward compat)
        location /xmpp-websocket {
            limit_req zone=ws_limit burst=5 nodelay;
            proxy_pass http://prosody_bosh/xmpp-websocket;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # BOSH endpoint to Prosody
        location /http-bind {
            limit_req zone=bosh_limit burst=10 nodelay;
            proxy_pass http://prosody_bosh/http-bind;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # File upload endpoint
        location /upload {
            client_max_body_size 10m;
            proxy_pass http://host.docker.internal:9091/upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Uploaded files
        location /uploads/ {
            proxy_pass http://host.docker.internal:9091/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        # SSL certificates
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Connection limit per IP
        limit_conn conn_limit 20;

        # Static files from Python server
        location / {
            limit_req zone=general_limit burst=20 nodelay;
            proxy_pass http://host.docker.internal:9090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint to Prosody
        location /xmpp-websocket {
            limit_req zone=ws_limit burst=5 nodelay;
            proxy_pass http://prosody_bosh/xmpp-websocket;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # BOSH endpoint to Prosody
        location /http-bind {
            limit_req zone=bosh_limit burst=10 nodelay;
            proxy_pass http://prosody_bosh/http-bind;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Buffering settings for BOSH
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # File upload endpoint
        location /upload {
            client_max_body_size 10m;
            proxy_pass http://host.docker.internal:9091/upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Uploaded files
        location /uploads/ {
            proxy_pass http://host.docker.internal:9091/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
